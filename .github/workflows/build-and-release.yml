name: Build and Update Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Compute Dynamic Version
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          SECRET_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/release.jks
            echo "Keystore successfully decoded to app/release.jks"
            echo "KEYSTORE_PASSWORD=${SECRET_STORE_PASS:-android}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${SECRET_KEY_ALIAS:-bijoybangla}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${SECRET_KEY_PASS:-android}" >> $GITHUB_ENV
          else
            echo "KEYSTORE_BASE64 is empty, creating signing keystore"
            keytool -genkeypair -v -keystore app/release.jks -alias bijoybangla -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=BijoyBangla, O=Android, C=US"
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=bijoybangla" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bijoy-bangla-apk
          path: app/build/outputs/apk/release/*.apk
