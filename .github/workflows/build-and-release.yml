name: Build and Release Beta APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Compute Dynamic Version
        run: |
          RUN_NUM=${{ github.run_number }}
          VERSION_CODE=$RUN_NUM
          VERSION_NAME="1.0.${RUN_NUM}-beta"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          SECRET_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/release.jks
            echo "Keystore successfully decoded to app/release.jks"
            echo "KEYSTORE_PASSWORD=${SECRET_STORE_PASS:-android}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${SECRET_KEY_ALIAS:-bijoybangla}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${SECRET_KEY_PASS:-android}" >> $GITHUB_ENV
          else
            echo "KEYSTORE_BASE64 is empty, creating signing keystore"
            keytool -genkeypair -v -keystore app/release.jks -alias bijoybangla -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=BijoyBangla, O=Android, C=US"
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=bijoybangla" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Android Release APK
        run: |
          ./gradlew :app:assembleRelease -PversionCode=${{ env.VERSION_CODE }} -PversionName=${{ env.VERSION_NAME }} --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" release-artifacts/BijoyBangla-latest.apk
            cp "$APK_FILE" "release-artifacts/BijoyBangla-v${{ env.VERSION_NAME }}.apk"
            cp "$APK_FILE" release-artifacts/BijoyBangla-beta.apk
            echo "{\"versionCode\": ${{ env.VERSION_CODE }}, \"versionName\": \"${{ env.VERSION_NAME }}\", \"tagName\": \"v${{ env.VERSION_NAME }}\", \"name\": \"Bijoy Bangla v${{ env.VERSION_NAME }}\", \"body\": \"Automated beta release for Bijoy Bangla Keyboard.\", \"apkUrl\": \"https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/BijoyBangla-latest.apk\"}" > release-artifacts/version.json
            echo "Successfully prepared release artifacts"
            ls -lh release-artifacts/
          else
            echo "::error::No APK file found in workspace after build!"
            exit 1
          fi

      - name: Prepare Release Notes
        run: |
          echo "## 🇧🇩 Bijoy Bangla v${{ env.VERSION_NAME }}" > release_body.md
          echo "✨ **আইফোন (iOS) ডিজাইনে পূর্ণাঙ্গ বাংলা কীবোর্ড**" >> release_body.md
          echo "" >> release_body.md
          echo "### 🚀 কী কী নতুন যুক্ত করা হয়েছে:" >> release_body.md
          echo "* 📱 **iOS Keyboard Clone**: আইফোনের হুবহু কী-ক্যাপ, পপআপ বাবল প্রিভিউ, ক্লিক সাউন্ড এবং হ্যাপটিক্স।" >> release_body.md
          echo "* 🧠 **Smart Chat Memory**: মেসেঞ্জার ও হোয়াটসঅ্যাপে নির্দিষ্ট চ্যাট অনুযায়ী ভাষা স্বয়ংক্রিয়ভাবে মনে রাখা।" >> release_body.md
          echo "* ⌨️ **৪টি কীবোর্ড লেআউট**: ইংরেজি (English), অভ্র ফোনেটিক (Avro), বিজয় পিসি (Bijoy Classic), এবং সহজ বাংলা (Smart Mobile)।" >> release_body.md
          echo "* 📋 **টাইপিং ও ক্লিপবোর্ড হিস্ট্রি**: টাইপ করা ডাটা ও ক্লিপবোর্ড হিস্ট্রি রেকর্ড ও প্রাইভেসি প্রটেকশন।" >> release_body.md
          echo "* 🔄 **In-App OTA Updates**: অ্যাপের ভেতর থেকেই সরাসরি এক ক্লিকে আপডেট চেক ও ডাউনলোড করার ব্যবস্থা।" >> release_body.md
          echo "" >> release_body.md
          echo "### 📝 কমিট লগ (Changelog):" >> release_body.md
          git log -n 5 --pretty=format:"* %s" >> release_body.md
          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "**Version**: \`v${{ env.VERSION_NAME }}\` (Build #${{ env.VERSION_CODE }})" >> release_body.md
          echo "**Commit**: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> release_body.md

      - name: Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ env.VERSION_NAME }}"
          commit: ${{ github.sha }}
          name: "Bijoy Bangla v${{ env.VERSION_NAME }}"
          bodyFile: "release_body.md"
          artifacts: "release-artifacts/*"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
